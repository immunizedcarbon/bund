name: Decimen WebView diagnosis

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: decimen-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Galaxy Tab S5e · direct WebView diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: immunizedcarbon/TowerD
          ref: decimen-security-review
          path: source
      - name: Download audited APK set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source/final-artifact
          gh run download 30608868255 \
            --repo immunizedcarbon/bund \
            --name decimen-final-verified \
            --dir source/final-artifact
          test -s source/final-artifact/app-debug.apk
          (cd source/final-artifact && sha256sum -c SHA256SUMS.txt)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Read self-test result through WebView DevTools
        shell: bash
        working-directory: source
        env:
          PROFILE: tabs5e
          API: '35'
          IMAGE: default
          RAM: '3072'
        run: |
          unset GITHUB_WORKSPACE
          bash ci/diagnose-webview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview-diagnosis-tabs5e
          path: source/evidence-tabs5e
          if-no-files-found: warn
          retention-days: 7
