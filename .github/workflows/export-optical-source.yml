name: Export repair workspace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: immunizedcarbon/TowerD
          ref: decimen-security-review
          path: source
      - name: Prepare workspace
        shell: bash
        run: |
          set -u
          mkdir -p export/native
          cat source/optical-transfer-build/optical-ci-v020.b64.part* | tr -d '[:space:]' | base64 --decode > /tmp/optical.zip
          unzip -o /tmp/optical.zip -d export/native || true
          cp -a source export/TowerD
          find export -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: decimen-repair-workspace
          path: export
          retention-days: 2
